# Role: compute: demos and the operator's shell.
# Shell with the robot API: AURMR_HOST=<compute host> docker compose -f compose/compute.yaml run --rm shell
x-ros: &ros
  image: ghcr.io/au-rmr/aurmr-2homa/base:dev
  build: {context: .., dockerfile: docker/base/Dockerfile}
  network_mode: host
  # ros2 launch shuts its nodes down in stages (SIGINT, then SIGTERM after a wait), which ran past
  # Docker's default 10 s and ended in SIGKILL at S4. SIGINT is what launch expects.
  stop_signal: SIGINT
  stop_grace_period: 30s
  ipc: host
  env_file: ["../sites/${AURMR_SITE:-uw_lab}/hosts/${AURMR_HOST:?set AURMR_HOST}/ros.env"]

services:
  net_listener:
    <<: *ros
    profiles: [net_test]
    command: ros2 run demo_nodes_cpp listener

  shell:
    <<: *ros
    profiles: [cli]
    volumes:
      - ..:/repo:ro
      - shell_ws:/ws
    environment:
      WORKCELL: /repo/sites/${AURMR_SITE:-uw_lab}/workcell.yaml
    stdin_open: true
    tty: true
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      colcon --log-base /ws/log build --base-paths /repo/robot /repo/end_effectors /repo/skills /repo/demos
      --build-base /ws/build --install-base /ws/install >/ws/colcon.txt &&
      source /ws/install/setup.bash && cd /repo && exec bash"

  # The capcup's board streams to this host: bridge, contact detector, haptic search. Profile tool.
  capcup:
    <<: *ros
    profiles: [tool]
    volumes:
      - ..:/repo:ro
      - tool_ws:/ws
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      colcon --log-base /ws/log build --base-paths /repo/end_effectors
      --build-base /ws/build --install-base /ws/install &&
      source /ws/install/setup.bash &&
      exec ros2 launch capcup_driver capcup.launch.py part:=compute
      site_dir:=/repo/sites/$${AURMR_SITE:-uw_lab}"
    restart: "no"

  # CapCup dashboard window (old ROS 1 cap_dashboard, ported). Profile dashboard. Needs the
  # desktop's DISPLAY and XAUTHORITY in the environment (e.g. DISPLAY=:1
  # XAUTHORITY=/run/user/$UID/gdm/Xauthority on inter). Image: docker/dashboard (adds pyqtgraph).
  dashboard:
    <<: *ros
    image: ghcr.io/au-rmr/aurmr-2homa/dashboard:dev
    build: {context: .., dockerfile: docker/dashboard/Dockerfile}
    profiles: [dashboard]
    volumes:
      - ..:/repo:ro
      - dashboard_ws:/ws
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY:?set XAUTHORITY}:/tmp/.Xauthority:ro
    environment:
      DISPLAY: ${DISPLAY:?set DISPLAY}
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      LIBGL_ALWAYS_SOFTWARE: "1"   # 2D plots only; avoids the nvidia-drm GLX warnings
      CAPCUP_CALIBRATION: /repo/sites/${AURMR_SITE:-uw_lab}/tools/capcup_calibration.yaml
    command: >
      bash -c "source /opt/ros/jazzy/setup.bash &&
      colcon --log-base /ws/log build --base-paths /repo/end_effectors
      --build-base /ws/build --install-base /ws/install &&
      source /ws/install/setup.bash &&
      exec ros2 run capcup_driver cap_dashboard"
    restart: "no"

volumes:
  shell_ws:
  tool_ws:
  dashboard_ws:
