# Role: planner (GPU host; lab: pinkman, sites/uw_lab/deployments/lab.yaml). Isaac Sim + Isaac Lab + MPPI/MCTS.
# Image is built locally on the planner host and never pushed (NVIDIA Isaac Sim licence): docker/planner/Dockerfile.
#   AURMR_HOST=pinkman docker compose -f compose/planner.yaml build planner_shell
#   AURMR_HOST=pinkman docker compose -f compose/planner.yaml run --rm planner_shell          # headless shell
#   AURMR_HOST=pinkman docker compose -f compose/planner.yaml --env-file ../sites/uw_lab/hosts/pinkman/display.env \
#       run --rm planner_gui                                                                   # with the Isaac viewer
x-planner: &planner
  image: aurmr-2homa/planner:local
  build: {context: .., dockerfile: docker/planner/Dockerfile}
  network_mode: host
  ipc: host
  stop_signal: SIGINT
  stop_grace_period: 30s
  env_file: ["../sites/${AURMR_SITE:-uw_lab}/hosts/${AURMR_HOST:?set AURMR_HOST}/ros.env"]
  environment:
    NVIDIA_DRIVER_CAPABILITIES: all
  deploy:
    resources:
      reservations:
        devices: [{driver: nvidia, count: all, capabilities: [gpu]}]
  volumes:
    - ..:/repo:ro
    - ${HOME}/aurmr-data:/data:ro
    - planner_cache:/root/.cache       # Kit shader + extension caches: first start is slow, later ones reuse it
    - ../runs:/runs                    # run records (gitignored): scenario, plan, solution, logs per episode
  stdin_open: true
  tty: true

services:
  # The bin-clearing planner node (S7): one episode per run (wait for poses, plan, stream MPPI commands).
  #   AURMR_HOST=pinkman docker compose -f compose/planner.yaml run --rm planner [--planner mcts] [--out /runs/...]
  planner:
    <<: *planner
    profiles: [planner]
    entrypoint: ["python", "-m", "bin_clearing_ros.planner_node"]
    command: []

  # Test double for the robot + cameras (policies/bin_clearing_ros/tests/fake_cell.py), e.g.
  #   ... run --rm planner_fake_cell --scenario /data/reference/.../scenarios/server_scenario.yaml --exit-after 20
  planner_fake_cell:
    <<: *planner
    profiles: [test]
    deploy: {}
    entrypoint: ["python", "/repo/policies/bin_clearing_ros/tests/fake_cell.py"]
    command: []

  planner_shell:
    <<: *planner
    profiles: [cli]
    command: bash

  planner_gui:
    <<: *planner
    profiles: [gui]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: all
      DISPLAY: ${DISPLAY:-}            # from display.env (--env-file); empty = no viewer
      XAUTHORITY: /tmp/.Xauthority
    volumes:
      - ..:/repo:ro
      - ${HOME}/aurmr-data:/data:ro
      - planner_cache:/root/.cache
      - ../runs:/runs
      - /tmp/.X11-unix:/tmp/.X11-unix:ro
      - ${XAUTHORITY_HOST:-/dev/null}:/tmp/.Xauthority:ro
    command: bash

volumes:
  planner_cache:
