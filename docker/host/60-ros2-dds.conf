# Kernel limits for large ROS 2 messages over Cyclone DDS (UDP).
# Without this, any message larger than net.core.rmem_max (Ubuntu default 4 MiB here)
# is silently dropped: Kinect 3072P colour (50 MB), depth_to_rgb (25 MB), RGB cloud (~400 MB).
# Install on every robot-LAN host:
#   sudo install -m 644 docker/host/60-ros2-dds.conf /etc/sysctl.d/ && sudo sysctl --system
# Only raises the maximum a socket may ask for; memory is used only by sockets that ask
# (docker/cyclonedds.xml asks for up to 256 MB).
net.core.rmem_max = 2147483647
net.ipv4.ipfrag_high_thresh = 134217728
net.ipv4.ipfrag_time = 3
