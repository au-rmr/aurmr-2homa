# Read at startup. See build plan S0: skills check capabilities against this.
name: capcup
urdf: urdf/tool.xacro
tcp_link: gripper_equilibrium_grasp
mass_kg: 0.205  # user, 2026-11-09
cog_m: [0.0, 0.0, 0.1067]   # from arm_tool0; middle of the cup body (0.0169 + 0.1795/2; lengths user 2026-11-10, was 0.1054)
capabilities: [contact, suction]
client: capcup_driver.client:CapCup   # built by aurmr_skills.load_tool(robot)
# Bool topics a move can stop on. The topics are published by the tool's drivers (S5).
stop_signals:
  contact: /cap_contact
  seal: /vacuum_seal
