# Read at startup. See build plan S0: skills check capabilities against this.
name: capcup
urdf: urdf/tool.xacro
tcp_link: gripper_equilibrium_grasp
links: [coupling, capacitive_cup, gripper_equilibrium_grasp, cup_aluminium_end]   # the tool's own links: a held item may touch them
mass_kg: 0.205  # user, 2026-11-09
cog_m: [0.0, 0.0, 0.1067]   # from arm_tool0; middle of the cup body (0.0169 + 0.1795/2; lengths user 2026-11-10, was 0.1054)
capabilities: [contact, suction]
client: capcup_driver.client:CapCup   # built by aurmr_skills.load_tool(robot)
# Bool topics a move can stop on. The topics are published by the tool's drivers (S5).
# A topic, or {topic, stale_s, max_speed}: stale_s = how old the last message may be before
# motion_server stops (default 0.1 s); max_speed = cap (m/s) on a move stopping on it.
# contact comes once per cap board sample, every 0.171 s (S6, 2026-11-12): 0.5 s = ~3 samples;
# at 0.01 m/s the tip moves 1.7 mm per sample and at most 5 mm before a dead board stops it.
stop_signals:
  contact: {topic: /cap_contact, stale_s: 0.5, max_speed: 0.02}   # 0.02 for the cap_cup approach (2026-11-13)
  seal: /vacuum_seal   # 50 Hz from the ejector driver
