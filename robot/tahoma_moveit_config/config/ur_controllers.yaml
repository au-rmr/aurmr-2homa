# Controllers for the UR driver, real arm and its mock. Trimmed from ur_robot_driver's
# ur_controllers.yaml. arm_controller keeps the mock's name, so motion_server and tests are the same.
controller_manager:
  ros__parameters:
    update_rate: 500   # UR16e, as ur16e_update_rate.yaml
    joint_state_broadcaster:
      type: joint_state_broadcaster/JointStateBroadcaster
    arm_controller:
      type: ur_controllers/ScaledJointTrajectoryController
    speed_scaling_state_broadcaster:
      type: ur_controllers/SpeedScalingStateBroadcaster
    force_torque_sensor_broadcaster:
      type: force_torque_sensor_broadcaster/ForceTorqueSensorBroadcaster
    io_and_status_controller:
      type: ur_controllers/GPIOController
    # S7: streamed joint velocities, fed only by motion_server. Spawned inactive; motion_server
    # switches between it and arm_controller. Joints + position limits come from the description at launch.
    streaming_velocity_controller:
      type: tahoma_control/StreamingVelocityController

speed_scaling_state_broadcaster:
  ros__parameters:
    state_publish_rate: 100.0
    tf_prefix: arm_

io_and_status_controller:
  ros__parameters:
    tf_prefix: arm_

force_torque_sensor_broadcaster:
  ros__parameters:
    sensor_name: arm_tcp_fts_sensor
    state_interface_names: [force.x, force.y, force.z, torque.x, torque.y, torque.z]
    frame_id: arm_tool0_controller

arm_controller:
  ros__parameters:
    joints: [arm_shoulder_pan_joint, arm_shoulder_lift_joint, arm_elbow_joint, arm_wrist_1_joint, arm_wrist_2_joint, arm_wrist_3_joint]
    command_interfaces: [position]
    state_interfaces: [position, velocity]
    state_publish_rate: 100.0
    action_monitor_rate: 20.0
    allow_partial_joints_goal: false
    # S7 finding (mock, 2026-11-18): the Jazzy default (true) makes the controller hold its LAST
    # position command when it is re-activated, i.e. the pose from before a streaming session, so
    # ending a session drove the arm back. false = hold the measured position.
    set_last_command_interface_value_as_state_on_activation: false
    constraints:
      stopped_velocity_tolerance: 0.2
      goal_time: 0.6   # the old ROS 1 bringup's value; the driver default is 0
      arm_shoulder_pan_joint: {trajectory: 0.2, goal: 0.1}
      arm_shoulder_lift_joint: {trajectory: 0.2, goal: 0.1}
      arm_elbow_joint: {trajectory: 0.2, goal: 0.1}
      arm_wrist_1_joint: {trajectory: 0.2, goal: 0.1}
      arm_wrist_2_joint: {trajectory: 0.2, goal: 0.1}
      arm_wrist_3_joint: {trajectory: 0.2, goal: 0.1}
    speed_scaling_interface_name: arm_speed_scaling/speed_scaling_factor

# Ceilings of the last-line checks; motion_server's session limits sit at or below these.
streaming_velocity_controller:
  ros__parameters:
    stale_timeout_s: 0.15     # old mppi bridge command_timeout
    max_velocity: 0.25        # rad/s per joint, = motion_server max_stream_velocity
    max_acceleration: 0.5     # rad/s^2: 0.1 rad/s stops in 0.2 s
    limit_margin_rad: 0.05
