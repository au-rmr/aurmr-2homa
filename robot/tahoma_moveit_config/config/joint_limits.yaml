# Velocities as in the old stack (= ur_description's UR16e limits).
# Accelerations 5.0 rad/s^2: UR's own ur_moveit_config/config/joint_limits.yaml ("chosen conservatively",
# needed for time parameterization). ur_description leaves them off. Moves scale them further.
joint_limits:
  arm_shoulder_pan_joint:
    has_velocity_limits: true
    max_velocity: 2.0943951023931953
    has_acceleration_limits: true
    max_acceleration: 5.0
  arm_shoulder_lift_joint:
    has_velocity_limits: true
    max_velocity: 2.0943951023931953
    has_acceleration_limits: true
    max_acceleration: 5.0
  arm_elbow_joint:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 5.0
  arm_wrist_1_joint:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 5.0
  arm_wrist_2_joint:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 5.0
  arm_wrist_3_joint:
    has_velocity_limits: true
    max_velocity: 3.141592653589793
    has_acceleration_limits: true
    max_acceleration: 5.0

# Pilz needs these even for PTP (LIN/CIRC use them; we don't). Pilz's documented example values.
cartesian_limits:
  max_trans_vel: 1.0
  max_trans_acc: 2.25
  max_trans_dec: -5.0
  max_rot_vel: 1.57
